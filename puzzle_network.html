<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Puzzle Dependency Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
        }

        #graph {
            width: 100vw;
            height: 100vh;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4ec9b0;
            z-index: 1000;
            max-width: 300px;
        }

        .controls h3 {
            margin: 0 0 10px 0;
            color: #4ec9b0;
            font-size: 16px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            color: #9cdcfe;
            margin-bottom: 5px;
        }

        .control-group select, .control-group input {
            width: 100%;
            padding: 5px;
            background: #2d2d2d;
            border: 1px solid #569cd6;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .legend {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #4ec9b0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 8px;
        }

        .tooltip {
            position: absolute;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #4ec9b0;
            border-radius: 6px;
            padding: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 2000;
            max-width: 250px;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-title {
            font-weight: bold;
            color: #4ec9b0;
            margin-bottom: 5px;
        }

        .tooltip-content {
            font-size: 12px;
            color: #dcdcdc;
        }

        .node-group {
            cursor: pointer;
        }

        .node-group:hover .node-bg {
            stroke: #4ec9b0;
            stroke-width: 3px;
        }

        .node-bg {
            transition: all 0.2s;
        }

        .node-image {
            border-radius: 50%;
        }

        .link {
            stroke: #569cd6;
            stroke-opacity: 0.3;
            stroke-width: 1px;
        }

        .link.highlighted {
            stroke: #4ec9b0;
            stroke-opacity: 0.8;
            stroke-width: 2px;
        }

        .node-label {
            font-size: 10px;
            fill: #dcdcdc;
            pointer-events: none;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>🎮 Puzzle Dependency Graph</h3>

        <div class="control-group">

            <select id="tierFilter">

        </div>

        <div class="control-group">

        </div>

        <div class="legend">
            <div class="legend-item">

        </div>
    </div>

        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        // Add zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // Tier colors
        const tierColors = {
            1: "#4ec9b0",
            2: "#569cd6",
            3: "#569cd6",
            4: "#c586c0",
            5: "#c586c0",
            6: "#dcdcaa",
            7: "#d16969"
        };

        // Create simulation
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("x", d3.forceX(width / 2).strength(0.1))
            .force("y", d3.forceY(height / 2).strength(0.1))
            .force("collision", d3.forceCollide().radius(20));

        // Create links
        const link = g.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link");

        // Create node groups
        const nodeGroup = g.append("g")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .attr("class", "node-group")
            .call(drag(simulation));

        // Add circles as backgrounds
        nodeGroup.append("circle")
            .attr("class", "node-bg")
            .attr("r", d => 15 + d.cardCount * 0.3)
            .attr("fill", d => tierColors[d.tier] || "#666")
            .attr("stroke", "#1e1e1e")
            .attr("stroke-width", 2);

        // Add images
        nodeGroup.append("image")
            .attr("class", "node-image")
            .attr("xlink:href", d => d.image)
            .attr("x", d => -(12 + d.cardCount * 0.3))
            .attr("y", d => -(12 + d.cardCount * 0.3))
            .attr("width", d => (12 + d.cardCount * 0.3) * 2)
            .attr("height", d => (12 + d.cardCount * 0.3) * 2)
            .attr("clip-path", "circle()")
            .style("pointer-events", "none")
            .on("error", function(e, d) {
                // If image fails to load, hide it
                d3.select(this).style("display", "none");
            });

        // Add interaction handlers to the group
        nodeGroup
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip)
            .on("click", highlightConnections);

        const node = nodeGroup.select("circle");

        // Add labels (only shown when zoomed in)
        const label = g.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .text(d => d.name.substring(0, 20))
            .style("opacity", 0);

        // Update positions on simulation tick
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            nodeGroup
                .attr("transform", d => `translate(${d.x},${d.y})`);

            label
                .attr("x", d => d.x)
                .attr("y", d => d.y - 25);
        });

        // Show labels when zoomed in
        svg.on("zoom", () => {
            const scale = d3.zoomTransform(svg.node()).k;
            label.style("opacity", scale > 1.5 ? 1 : 0);
        });

        // Drag behavior
        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        // Tooltip
        function showTooltip(event, d) {
            const tooltip = d3.select("#tooltip");
            const title = d3.select("#tooltipTitle");
            const content = d3.select("#tooltipContent");

            title.text(d.name);
            content.html(`
                <strong>Tier:</strong> ${d.tier}<br>
                <strong>Cards:</strong> ${d.cardCount}<br>
                <strong>Provides:</strong> ${d.provides.length > 0 ? d.provides.join(", ") : "None"}
            `);

            tooltip
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY + 15) + "px")
                .classed("visible", true);
        }

        function hideTooltip() {
            d3.select("#tooltip").classed("visible", false);
        }

        // Highlight connections
        let selectedNode = null;
        function highlightConnections(event, d) {
            if (selectedNode === d) {
                // Deselect
                selectedNode = null;
                link.classed("highlighted", false);
                node.style("opacity", 1);
            } else {
                // Select
                selectedNode = d;

                const connectedNodes = new Set();
                connectedNodes.add(d.id);

                link.classed("highlighted", l => {
                    if (l.source.id === d.id || l.target.id === d.id) {
                        connectedNodes.add(l.source.id);
                        connectedNodes.add(l.target.id);
                        return true;
                    }
                    return false;
                });

                nodeGroup.style("opacity", n => connectedNodes.has(n.id) ? 1 : 0.2);
            }
        }

        // Tier filter
        d3.select("#tierFilter").on("change", function() {
            const tier = this.value;
            if (tier === "all") {
                nodeGroup.style("display", "block");
                link.style("display", "block");
            } else {
                const tierNum = parseInt(tier);
                nodeGroup.style("display", d => d.tier === tierNum ? "block" : "none");
                link.style("display", l => {
                    const sourceVisible = l.source.tier === tierNum;
                    const targetVisible = l.target.tier === tierNum;
                    return sourceVisible && targetVisible ? "block" : "none";
                });
            }
        });

        // Search
        d3.select("#searchBox").on("input", function() {
            const search = this.value.toLowerCase();
            if (search === "") {
                nodeGroup.style("opacity", 1);
                nodeGroup.select(".node-bg").attr("r", d => 15 + d.cardCount * 0.3);
                nodeGroup.select(".node-image")
                    .attr("x", d => -(12 + d.cardCount * 0.3))
                    .attr("y", d => -(12 + d.cardCount * 0.3))
                    .attr("width", d => (12 + d.cardCount * 0.3) * 2)
                    .attr("height", d => (12 + d.cardCount * 0.3) * 2);
            } else {
                nodeGroup.style("opacity", d => d.name.toLowerCase().includes(search) ? 1 : 0.2);
                nodeGroup.select(".node-bg").attr("r", d => {
                    return d.name.toLowerCase().includes(search) ? 20 + d.cardCount * 0.3 : 15 + d.cardCount * 0.3;
                });
                nodeGroup.select(".node-image")
                    .attr("x", d => {
                        const size = d.name.toLowerCase().includes(search) ? 17 : 12;
                        return -(size + d.cardCount * 0.3);
                    })
                    .attr("y", d => {
                        const size = d.name.toLowerCase().includes(search) ? 17 : 12;
                        return -(size + d.cardCount * 0.3);
                    })
                    .attr("width", d => {
                        const size = d.name.toLowerCase().includes(search) ? 17 : 12;
                        return (size + d.cardCount * 0.3) * 2;
                    })
                    .attr("height", d => {
                        const size = d.name.toLowerCase().includes(search) ? 17 : 12;
                        return (size + d.cardCount * 0.3) * 2;
                    });
            }
        });
