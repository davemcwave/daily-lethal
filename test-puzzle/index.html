<!doctype html>
<meta charset="utf-8">
<title>Lethal – Today</title> 
<script>
  // Pick up device preference
  let deviceType = localStorage.getItem('device_type');
  if (deviceType !== 'desktop' && deviceType !== 'mobile') {
    deviceType = 'mobile'; // default fallback
  }

  // Build target URL (just /mobile/ or /desktop/)
  const target = new URL("/" + deviceType + "/", window.location.origin);

  // Copy over all query params from current page
  const currentParams = new URLSearchParams(window.location.search);
  currentParams.forEach((value, key) => {
    target.searchParams.set(key, value);
  });

  // Redirect
  location.replace(target.toString());
</script>
