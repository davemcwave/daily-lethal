  <script>
    (function handleCustomRedirects() {
      try {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        var normalizedSearch = search
          ? (search.startsWith("?") ? search : "?" + search)
          : "";
        var dateMatch = path.match(/^\/(\d{4}-\d{2}-\d{2})\/?$/);
        if (!dateMatch) {
          return;
        }

        fetch("/custom-redirects.json", { cache: "no-store" })
          .then(function(response) {
            if (!response.ok) {
              throw new Error("Redirect map load failed");
            }
            return response.json();
          })
          .then(function(map) {
            var redirects = (map && typeof map === "object") ? map : {};
            if (map && map.date_redirects) {
              redirects = map.date_redirects;
            }
            var dateKey = dateMatch[1];
            var target = redirects[dateKey] || redirects["/" + dateKey] || redirects[path];
            if (typeof target === "string" && target.length > 0) {
              var normalizedTarget;
              if (/^https?:\/\//i.test(target)) {
                normalizedTarget = target;
              } else if (target.startsWith("/")) {
                normalizedTarget = target;
              } else if (target.startsWith("?")) {
                normalizedTarget = "/" + target;
              } else {
                normalizedTarget = "/" + target;
              }
              if (normalizedTarget.indexOf("puzzle_date=") === -1) {
                var joinChar = normalizedTarget.indexOf("?") === -1 ? "?" : "&";
                normalizedTarget = normalizedTarget + joinChar + "puzzle_date=" + encodeURIComponent(dateKey);
              }
              window.location.replace(normalizedTarget);
            }
          })
          .catch(function(err) {
            console.error("Custom redirect error", err);
          });
      } catch (error) {
        console.error("Custom redirect exception", error);
      }
    })();
  </script>

  <script>
    (function redirectTestLinks() {
      try {
        var search = window.location.search || "";
        if (!search.includes("cards=")) {
          return;
        }
        var path = window.location.pathname || "/";
        if (path.startsWith("/desktop") || path.startsWith("/mobile")) {
          return;
        }
        var preferred = localStorage.getItem("device_type") === "desktop" ? "desktop" : "mobile";
        var basePath = preferred === "desktop" ? "/desktop" : "/mobile";
        var normalizedPath = path === "/" ? "/" : path;
        var destinationPath = basePath + (normalizedPath === "/" ? "/" : normalizedPath);
        var hash = window.location.hash || "";
        window.location.replace(destinationPath + search + hash);
      } catch (err) {
        console.error("Test link redirect failed", err);
      }
    })();

  <script>
    // On click, set device_type
    const toggle = document.getElementById('desktop-toggle');
    const label = document.getElementById('desktop-label');

    // Init
    if (localStorage.getItem('device_type') === 'desktop') {
      toggle.checked = true;
      label.innerText = "Enable Desktop Version";
    }

    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        localStorage.setItem('device_type', 'desktop');
        label.innerText = "Enable Desktop Version";
      } else {
        localStorage.setItem('device_type', 'mobile');
        label.innerText = "Enable Desktop Version";
      }
    });

    async function fetchLatestPuzzleDate() {
      const response = await fetch("/manifest.json?ts=" + Date.now(), { cache: "no-store" });
      if (!response.ok) {
        throw new Error("Failed to fetch manifest.json");
      }
      const payload = await response.json();
      const puzzles = Array.isArray(payload?.puzzles) ? payload.puzzles : [];
      const parsed = [];
      for (const entry of puzzles) {
        if (typeof entry?.id !== 'string' || typeof entry?.release_at !== 'string') {
          continue;
        }
        const releaseDate = new Date(entry.release_at);
        if (Number.isNaN(releaseDate.getTime())) {
          continue;
        }
        parsed.push({ id: entry.id, release: releaseDate });
      }
      if (!parsed.length) {
        return null;
      }
      const now = new Date();
      const available = parsed
        .filter(entry => entry.release <= now)
        .sort((a, b) => b.release - a.release);
      if (available.length > 0) {
        return available[0].id;
      }
      parsed.sort((a, b) => a.release - b.release);
      return parsed[0].id;
    }

    async function redirectToToday() {
      const fallback = '/today';
      try {
        const latestDate = await fetchLatestPuzzleDate();
        if (!latestDate) {
          window.location.href = fallback;
          return;
        }
        window.location.href = '/' + latestDate + '/';
      } catch (err) {
        console.error('redirectToToday failed', err);
        window.location.href = fallback;
      }
    }


    const bannerLink = document.getElementById('steam-banner-link');
    bannerLink && bannerLink.addEventListener('click', () => {
      if (typeof gtag === 'function') {
        gtag('event', 'steam_banner_click', { event_category: 'steam', event_label: 'banner' });
      }
    });

    (function manageSteamSplash() {
      const STORAGE_KEY = 'steam_splash_seen_v1';
      const COOLDOWN_MS = 7 * 24 * 60 * 60 * 1000; // reshow weekly
      const splash = document.getElementById('steam-splash');
      const closeBtn = document.getElementById('steam-splash-close');
      const cta = document.getElementById('steam-splash-cta');

      if (!splash) {
        return;
      }

      const lastSeen = Number(localStorage.getItem(STORAGE_KEY) || 0);
      const shouldShow = !lastSeen || (Date.now() - lastSeen) > COOLDOWN_MS;
      if (shouldShow) {
        splash.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function markSeen(label) {
        localStorage.setItem(STORAGE_KEY, Date.now().toString());
        if (typeof gtag === 'function') {
          gtag('event', label, { event_category: 'steam', event_label: label });
        }
      }

      function hideSplash() {
        if (splash.classList.contains('hidden')) {
          return;
        }
        splash.classList.add('hidden');
        document.body.style.overflow = '';
      }

      closeBtn && closeBtn.addEventListener('click', () => {
        hideSplash();
        markSeen('steam_splash_dismiss_close');
      });
      splash.addEventListener('click', (event) => {
        if (event.target === splash) {
          hideSplash();
          markSeen('steam_splash_dismiss_backdrop');
        }
      });

      cta && cta.addEventListener('click', () => {
        hideSplash();
        markSeen('steam_splash_cta');
      });
    })();
  </script>
