<!doctype html>
<meta charset="utf-8">
<title>Lethal – Today</title>
<script>
(async function() {
  try {
    // 1) Fetch manifest
    const resp = await fetch("../manifest.json", {cache:"no-store"});
    const manifest = await resp.json();

    // 2) Current time in America/New_York
    const now = new Date();
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    const parts = Object.fromEntries(fmt.formatToParts(now).map(p => [p.type, p.value]));
    const nowStr = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}-04:00`;
    const nowDate = new Date(nowStr);

    // 3) Pick latest puzzle <= now
    let latest = null;
    for (const p of manifest.puzzles) {
      const rel = new Date(p.release_at);
      if (rel <= nowDate && (!latest || rel > new Date(latest.release_at))) {
        latest = p;
      }
    }

    if (!latest) {
      document.body.textContent = "No puzzle released yet.";
      return;
    }

    // 4) Decide device type
    let deviceType = localStorage.getItem('device_type');
    if (deviceType !== 'desktop' && deviceType !== 'mobile') {
      deviceType = 'mobile'; // default
    }

    // 5) Redirect
    location.replace("/" + deviceType + "?puzzle=" + latest.id);

  } catch (e) {
    console.error("Failed to load manifest:", e);
    document.body.textContent = "Error loading latest puzzle.";
  }
})();
</script>
