<!doctype html>
<meta charset="utf-8">
<title>Lethal – Today</title>
<script>
  (async () => {
    // Resolve device preference
    let deviceType = localStorage.getItem('device_type');
    if (deviceType !== 'desktop' && deviceType !== 'mobile') {
      deviceType = 'mobile';
    }

    // Fetch the manifest (no-cache to be safe)
    const manifestUrl = "/manifest.json?ts=" + Date.now();

    // Helpers
    const toDate = (s) => new Date(s); // release_at has timezone offsets, so this is safe
    const byReleaseDesc = (a, b) => toDate(b.release_at) - toDate(a.release_at);

    let targetDate = null;

    try {
      const res = await fetch(manifestUrl, { cache: "no-cache" });
      if (!res.ok) throw new Error("Failed to load manifest.json");
      const data = await res.json();
      const puzzles = Array.isArray(data?.puzzles) ? data.puzzles : [];
      const now = new Date();

      // Choose the newest puzzle whose release_at is not in the future
      const available = puzzles.filter(p => toDate(p.release_at) <= now).sort(byReleaseDesc);

      if (available.length > 0) {
        targetDate = available[0].id; // e.g. "2025-08-27"
      } else if (puzzles.length > 0) {
        // If everything is in the future, choose the earliest one (or pick your preferred fallback)
        targetDate = puzzles.sort(byReleaseDesc).at(-1).id;
      }
    } catch (e) {
      // If manifest fetch/parsing fails, do nothing here—fallback below
      console.error(e);
    }

    // Final fallback if we still don't have a date
    if (!targetDate) {
      // Hard fallback: send to root by device
      location.replace("/" + deviceType + "/");
      return;
    }

    // Update title (optional nicety)
    try { document.title = "Lethal – " + targetDate; } catch {}

    // Redirect to the resolved date
    location.replace("/" + deviceType + "/" + targetDate + "/");
  })();
</script>
