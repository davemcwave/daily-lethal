<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Language" content="en">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lethal Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #88e2ff;
      margin-bottom: 2rem;
    }
    .post-list {
      max-width: 700px;
      margin: auto;
    }
    .post {
      background: #222;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      transition: background 0.2s;
    }
    .post:hover {
      background: #2a2a2a;
    }
    .post a {
      color: #88e2ff;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: bold;
    }
    .post p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Lethal Blog</h1>
  <div class="post-list" id="post-list"></div>

  <script>
    fetch('/blog/posts.json')
      .then(res => res.json())
      .then(posts => {
        const container = document.getElementById('post-list');
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        posts.forEach(post => {
          const div = document.createElement('div');
          div.className = 'post';
          div.innerHTML = `
            <a href="/blog/viewer.html?slug=${post.slug}">${post.title}</a>
            <p>${post.excerpt}</p>
          `;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
