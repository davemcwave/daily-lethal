<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lethal – 2026-02-22</title>
  <script>
    (function redirectViaJson() {
      var dateKey = "2026-02-22";
      fetch("/custom-redirects.json", { cache: "no-store" })
        .then(function(response) {
          if (!response.ok) {
            throw new Error("Failed to load redirect map");
          }
          return response.json();
        })
        .then(function(map) {
          var redirects = (map && map.date_redirects) ? map.date_redirects : map;
          var target = redirects[dateKey] || redirects["/" + dateKey];
          if (typeof target !== "string" || target.length === 0) {
            return;
          }
          var normalized;
          if (/^https?:\/\//i.test(target)) {
            normalized = target;
          } else if (target.startsWith("/")) {
            normalized = target;
          } else if (target.startsWith("?")) {
            normalized = "/" + target;
          } else {
            normalized = "/" + target;
          }
          window.location.replace(normalized);
        })
        .catch(function(err) {
          console.error("Date redirect error", err);
        });
    })();
  </script>
</head>
<body></body>
</html>
