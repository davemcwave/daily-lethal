<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Card Effect Editor Mockup</title>
  <style>
    body {
      background:#0f141b;
      color:#f4f4f4;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin:0;
      padding:16px;
    }
    h2 {
      margin-top:0;
      margin-bottom:12px;
      font-size:18px;
    }
    .app {
      display:grid;
      grid-template-columns: 260px 1.4fr 1.1fr;
      gap:16px;
      height:95vh;
      box-sizing:border-box;
    }
    .column {
      background:#181f29;
      border-radius:12px;
      padding:12px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .scroll {
      overflow-y:auto;
      padding-right:4px;
    }

    /* Effect library */
    .effect-tile {
      background:#151c26;
      border-radius:8px;
      border:1px solid #262f40;
      padding:8px;
      margin-bottom:8px;
      cursor:pointer;
      transition:background 0.08s, border-color 0.08s, transform 0.06s;
    }
    .effect-tile:hover {
      background:#202738;
      border-color:#3bd1ff;
      transform:translateY(-1px);
    }
    .tile-title {
      font-weight:600;
      font-size:14px;
    }
    .tile-desc {
      font-size:12px;
      opacity:0.8;
    }

    /* Card effects */
    .effects-empty {
      font-size:13px;
      opacity:0.7;
      padding:4px;
    }
    .effect-block {
      background:#151c26;
      border-radius:8px;
      border:1px solid #262f40;
      margin-bottom:8px;
      overflow:hidden;
    }
    .effect-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:6px 8px;
      cursor:pointer;
      user-select:none;
    }
    .effect-header-main {
      display:flex;
      flex-direction:column;
    }
    .effect-name {
      font-weight:600;
      font-size:14px;
    }
    .effect-summary {
      font-size:12px;
      opacity:0.8;
    }
    .effect-actions {
      display:flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      opacity:0.7;
    }
    .pill-tag {
      border-radius:999px;
      padding:2px 7px;
      border:1px solid #3bd1ff55;
      font-size:11px;
    }
    .btn-small {
      border-radius:999px;
      padding:2px 7px;
      border:1px solid #444;
      cursor:pointer;
    }
    .btn-small:hover {
      border-color:#f55;
      color:#f88;
    }
    .drawer {
      padding:8px 8px 10px 8px;
      border-top:1px solid #262f40;
      background:#10151f;
      font-size:13px;
    }
    .input-row {
      display:flex;
      flex-direction:column;
      margin-bottom:6px;
    }
    .input-row label {
      font-size:12px;
      opacity:0.8;
      margin-bottom:2px;
    }
    .input-row input,
    .input-row select {
      background:#0b1018;
      border-radius:6px;
      border:1px solid #303a4a;
      padding:4px 6px;
      color:#f4f4f4;
      font-size:13px;
    }
    .add-hint {
      margin-top:4px;
      font-size:12px;
      opacity:0.75;
    }

    /* Preview */
    .preview-card {
      background:#151c26;
      border-radius:14px;
      border:2px solid #262f40;
      padding:12px;
      box-sizing:border-box;
      min-height:200px;
    }
    .preview-title {
      font-weight:700;
      margin-bottom:4px;
    }
    .preview-cost {
      float:right;
      font-weight:700;
      padding:2px 6px;
      border-radius:999px;
      border:1px solid #3bd1ff99;
      font-size:12px;
    }
    .preview-body {
      font-size:13px;
      margin-top:18px;
      white-space:pre-line;
    }
    .preview-json {
      margin-top:12px;
      padding:8px;
      font-size:11px;
      background:#0b1018;
      border-radius:8px;
      border:1px solid #262f40;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Library -->
    <div class="column">
      <h2>Effect Library</h2>
      <div class="scroll" id="library">
        <!-- tiles injected by JS -->
      </div>
    </div>

    <!-- Card Effects -->
    <div class="column">
      <h2>Card Effects</h2>
      <div class="scroll" id="effectsList">
        <!-- effects injected by JS -->
      </div>
      <div class="add-hint">Click an effect on the left to add it to this card.</div>
    </div>

    <!-- Preview -->
    <div class="column">
      <h2>Preview</h2>
      <div class="preview-card" id="previewCard">
        <div class="preview-cost" id="previewCost">1</div>
        <div class="preview-title" id="previewTitle">Custom Card</div>
        <div class="preview-body" id="previewText">
          (No effects yet)
        </div>
      </div>
      <div class="preview-json" id="previewJson"></div>
    </div>
  </div>

  <script>
    (function() {
      const libraryEffects = [
        { type: "damage", name: "Damage", desc: "Deal X damage", defaults: { amount: 6, multiplier: 1.0 } },
        { type: "heal", name: "Heal", desc: "Recover X HP", defaults: { amount: 4 } },
        { type: "repeat", name: "Apply Repeat", desc: "Repeat the next card played", defaults: {} },
        { type: "gain_energy", name: "Gain Energy", desc: "Add X energy", defaults: { amount: 1 } },
        { type: "apply_buff", name: "Apply Buff", desc: "Add a named buff", defaults: { buffName: "Repeat", stacks: 1 } }
      ];

      let effects = [];
      let expandedId = null;
      let nextId = 1;

      const libraryEl = document.getElementById("library");
      const effectsListEl = document.getElementById("effectsList");
      const previewTextEl = document.getElementById("previewText");
      const previewJsonEl = document.getElementById("previewJson");

      function renderLibrary() {
        libraryEl.innerHTML = "";
        libraryEffects.forEach(def => {
          const div = document.createElement("div");
          div.className = "effect-tile";
          div.innerHTML = `
            <div class="tile-title">${def.name}</div>
            <div class="tile-desc">${def.desc}</div>
          `;
          div.addEventListener("click", () => addEffect(def));
          libraryEl.appendChild(div);
        });
      }

      function addEffect(def) {
        const newEffect = {
          id: nextId++,
          type: def.type,
          name: def.name,
          config: { ...def.defaults }
        };
        effects.push(newEffect);
        expandedId = newEffect.id;
        renderEffects();
        renderPreview();
      }

      function removeEffect(id) {
        effects = effects.filter(e => e.id !== id);
        if (expandedId === id) expandedId = null;
        renderEffects();
        renderPreview();
      }

      function updateEffectConfig(id, key, value) {
        const eff = effects.find(e => e.id === id);
        if (!eff) return;
        if (key === "amount" || key === "multiplier" || key === "stacks") {
          const num = parseFloat(value);
          eff.config[key] = isNaN(num) ? 0 : num;
        } else {
          eff.config[key] = value;
        }
        renderEffects();
        renderPreview();
      }

      function effectSummary(eff) {
        switch (eff.type) {
          case "damage":
            return \`Deal \${eff.config.amount ?? 0} damage\`;
          case "heal":
            return \`Heal \${eff.config.amount ?? 0} HP\`;
          case "repeat":
            return "Repeat the next card played";
          case "gain_energy":
            return \`Gain \${eff.config.amount ?? 0} energy\`;
          case "apply_buff":
            return \`Apply buff '\${eff.config.buffName || "Buff"}' (\${eff.config.stacks ?? 1} stack)\`;
          default:
            return "(no summary)";
        }
      }

      function renderEffects() {
        effectsListEl.innerHTML = "";
        if (!effects.length) {
          const empty = document.createElement("div");
          empty.className = "effects-empty";
          empty.textContent = "No effects on this card yet.";
          effectsListEl.appendChild(empty);
          return;
        }

        effects.forEach(eff => {
          const block = document.createElement("div");
          block.className = "effect-block";

          const header = document.createElement("div");
          header.className = "effect-header";
          header.innerHTML = `
            <div class="effect-header-main">
              <span class="effect-name">${eff.name}</span>
              <span class="effect-summary">${effectSummary(eff)}</span>
            </div>
            <div class="effect-actions">
              <span class="pill-tag">${eff.type}</span>
              <span class="btn-small" data-delete="1">Delete</span>
            </div>
          `;
          header.addEventListener("click", (ev) => {
            const isDelete = ev.target && ev.target.getAttribute("data-delete");
            if (isDelete) {
              ev.stopPropagation();
              removeEffect(eff.id);
              return;
            }
            expandedId = expandedId === eff.id ? null : eff.id;
            renderEffects();
          });

          block.appendChild(header);

          if (expandedId === eff.id) {
            const drawer = document.createElement("div");
            drawer.className = "drawer";

            if (eff.type === "damage") {
              drawer.innerHTML = `
                <div class="input-row">
                  <label>Damage Amount</label>
                  <input type="number" value="${eff.config.amount ?? 0}" data-key="amount" />
                </div>
                <div class="input-row">
                  <label>Multiplier</label>
                  <input type="number" step="0.1" value="${eff.config.multiplier ?? 1}" data-key="multiplier" />
                </div>
              `;
            } else if (eff.type === "heal") {
              drawer.innerHTML = `
                <div class="input-row">
                  <label>Heal Amount</label>
                  <input type="number" value="${eff.config.amount ?? 0}" data-key="amount" />
                </div>
              `;
            } else if (eff.type === "gain_energy") {
              drawer.innerHTML = `
                <div class="input-row">
                  <label>Energy Gained</label>
                  <input type="number" value="${eff.config.amount ?? 0}" data-key="amount" />
                </div>
              `;
            } else if (eff.type === "apply_buff") {
              drawer.innerHTML = `
                <div class="input-row">
                  <label>Buff Name</label>
                  <input type="text" value="${eff.config.buffName || ""}" data-key="buffName" />
                </div>
                <div class="input-row">
                  <label>Stacks</label>
                  <input type="number" value="${eff.config.stacks ?? 1}" data-key="stacks" />
                </div>
              `;
            } else if (eff.type === "repeat") {
              drawer.innerHTML = `
                <div class="input-row">
                  <label>Repeat Settings</label>
                  <input type="text" value="Next card only" disabled />
                </div>
              `;
            }

            drawer.querySelectorAll("input, select").forEach(input => {
              input.addEventListener("input", () => {
                const key = input.getAttribute("data-key");
                if (!key) return;
                updateEffectConfig(eff.id, key, input.value);
              });
            });

            block.appendChild(drawer);
          }

          effectsListEl.appendChild(block);
        });
      }

      function renderPreview() {
        if (!effects.length) {
          previewTextEl.textContent = "(No effects yet)";
          previewJsonEl.textContent = "";
          return;
        }

        const lines = effects.map((eff, idx) => `${idx + 1}. ${effectSummary(eff)}`);
        previewTextEl.textContent = lines.join("\n");

        const json = {
          cost: 1,
          name: "Custom Card",
          effects: effects.map(eff => ({
            type: eff.type,
            ...eff.config
          }))
        };
        previewJsonEl.textContent = JSON.stringify(json, null, 2);
      }

      // init
      renderLibrary();
      renderEffects();
      renderPreview();
    })();
  </script>
</body>
</html>
