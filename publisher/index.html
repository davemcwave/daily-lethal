<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lethal Puzzle Publisher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #ddd;
      padding: 2rem;
    }
    h1 { color: #0ff; font-size: 1.5rem; margin-bottom: 1.5rem; letter-spacing: 1px; }
    h2 { font-size: 1rem; color: #aaa; margin-bottom: 1rem; }

    .setup {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding: 1rem;
      background: #1a1a1a;
      border-radius: 8px;
    }
    .setup-status {
      font-size: 0.85rem;
      color: #888;
    }
    .setup-status.ok { color: #4f4; }
    .setup-status.err { color: #f44; }

    button {
      background: #0ff;
      color: #000;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    button:hover { background: #0dd; }
    button:disabled { background: #555; color: #888; cursor: default; }
    button.publish-btn {
      background: #4f4;
      color: #000;
    }
    button.publish-btn:hover { background: #3c3; }
    button.publish-btn:disabled { background: #555; color: #888; }

    input[type="text"], input[type="date"], select {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus {
      outline: 1px solid #0ff;
      border-color: #0ff;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 780px;
    }

    .sub-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
    }
    .sub-card.published { border-color: #4f4; opacity: 0.6; }
    .sub-card.published:hover { opacity: 1; }

    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .sub-date {
      font-size: 0.75rem;
      color: #777;
    }
    .published-badge {
      font-size: 0.75rem;
      background: #1a3a1a;
      color: #4f4;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid #4f4;
    }

    .sub-fields {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.4rem 0.75rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .sub-fields label {
      font-size: 0.8rem;
      color: #888;
      text-align: right;
    }

    .sub-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #2a2a2a;
    }

    .sub-preview {
      font-size: 0.7rem;
      color: #666;
      margin-top: 0.5rem;
      word-break: break-all;
      font-family: monospace;
    }

    .sub-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #bbb;
    }

    .stat-field label {
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.65rem;
      display: block;
      margin-bottom: 0.15rem;
    }

    .stat-field input {
      width: 100%;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.2rem 0.4rem;
      color: #eee;
      font-size: 0.85rem;
    }

    .sub-solution {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 0.25rem;
      word-break: break-word;
      white-space: pre-wrap;
      font-family: monospace;
    }

    .sub-solution .no-solution {
      font-style: italic;
      color: #666;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.ok { background: #1a3a1a; color: #4f4; border: 1px solid #4f4; }
    .toast.err { background: #3a1a1a; color: #f44; border: 1px solid #f44; }

    #no-submissions { color: #555; font-style: italic; padding: 1rem; }
  </style>
</head>
<body>

<h1>⚔ Lethal Puzzle Publisher</h1>

<div class="setup">
  <button id="btn-folder" onclick="openFolder()">Open Repo Folder</button>
  <span id="folder-status" class="setup-status">No folder selected</span>
  <div style="width:1px;height:24px;background:#333;"></div>
  <button id="btn-import" onclick="document.getElementById('json-input').click()" disabled>Import Formspree JSON</button>
  <input type="file" id="json-input" accept=".json" style="display:none" onchange="loadJSON(this)" />
  <span id="import-status" class="setup-status">No file loaded</span>
</div>

<div id="submissions-section">
  <div id="no-submissions">Open a folder and import a JSON to get started.</div>
  <div class="cards-list" id="cards-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let dirHandle = null;
let publishedDates = new Set();

const STORAGE_KEYS = {
  SUBMISSIONS: 'publisherCachedSubmissions',
  IMPORT_META: 'publisherCachedImportMeta',
  REPO_NAME: 'publisherRepoName',
};

hydrateCachedState();

function hydrateCachedState() {
  hydrateRepoStatus();
  hydrateCachedSubmissions();
}

function hydrateRepoStatus() {
  const statusEl = document.getElementById('folder-status');
  if (!statusEl || dirHandle) return;
  try {
    const repoName = localStorage.getItem(STORAGE_KEYS.REPO_NAME);
    if (repoName) {
      statusEl.textContent = `Last repo: ${repoName} (reopen to enable publishing)`;
      statusEl.className = 'setup-status';
    }
  } catch (err) {
    console.warn('Repo cache hydrate failed:', err);
  }
}

function hydrateCachedSubmissions() {
  try {
    const cached = localStorage.getItem(STORAGE_KEYS.SUBMISSIONS);
    if (!cached) return;
    const parsed = JSON.parse(cached);
    if (!Array.isArray(parsed) || parsed.length === 0) return;
    document.getElementById('no-submissions').style.display = 'none';
    renderCards(parsed);
    const statusEl = document.getElementById('import-status');
    if (statusEl) {
      const metaRaw = localStorage.getItem(STORAGE_KEYS.IMPORT_META);
      let label = '';
      if (metaRaw) {
        try {
          const meta = JSON.parse(metaRaw);
          if (meta?.label) label = meta.label;
          if (meta?.cached_at) {
            const when = new Date(meta.cached_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            statusEl.textContent = `⚡ Cached ${parsed.length} submissions${label ? ` from ${label}` : ''} (${when})`;
          } else {
            statusEl.textContent = `⚡ Cached ${parsed.length} submissions${label ? ` from ${label}` : ''}`;
          }
        } catch {
          statusEl.textContent = `⚡ Cached ${parsed.length} submissions`;
        }
      } else {
        statusEl.textContent = `⚡ Cached ${parsed.length} submissions`;
      }
      statusEl.className = 'setup-status ok';
    }
  } catch (err) {
    console.warn('Submission cache hydrate failed:', err);
  }
}

function cacheSubmissions(subs, meta = {}) {
  try {
    localStorage.setItem(STORAGE_KEYS.SUBMISSIONS, JSON.stringify(subs));
    localStorage.setItem(
      STORAGE_KEYS.IMPORT_META,
      JSON.stringify({
        label: meta.label || '',
        cached_at: new Date().toISOString(),
      })
    );
  } catch (err) {
    console.warn('Failed to cache submissions:', err);
  }
}

function rememberRepoName(name) {
  try {
    localStorage.setItem(STORAGE_KEYS.REPO_NAME, name || '');
  } catch (err) {
    console.warn('Failed to cache repo name:', err);
  }
}

async function openFolder() {
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    // Load published dates from custom-redirects.json
    const f = await getFile('custom-redirects.json');
    const text = await f.text();
    const redirects = JSON.parse(text);
    publishedDates = new Set(Object.keys(redirects));
    document.getElementById('folder-status').textContent = '✓ ' + dirHandle.name;
    document.getElementById('folder-status').className = 'setup-status ok';
    document.getElementById('btn-import').disabled = false;
    refreshPublishedState();
    updatePublishButtonsState();
    rememberRepoName(dirHandle.name);
  } catch (e) {
    if (e.name !== 'AbortError') showToast('Failed to open folder: ' + e.message, 'err');
  }
}

async function getFile(relativePath) {
  const parts = relativePath.split('/');
  let handle = dirHandle;
  for (let i = 0; i < parts.length - 1; i++) {
    handle = await handle.getDirectoryHandle(parts[i]);
  }
  const fh = await handle.getFileHandle(parts[parts.length - 1]);
  return fh.getFile();
}

async function getFileHandle(relativePath, create = false) {
  const parts = relativePath.split('/');
  let handle = dirHandle;
  for (let i = 0; i < parts.length - 1; i++) {
    handle = await handle.getDirectoryHandle(parts[i]);
  }
  return handle.getFileHandle(parts[parts.length - 1], { create });
}

function loadJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const subs = data.submissions || [];
      subs.sort((a, b) => new Date(b._date) - new Date(a._date));
      document.getElementById('import-status').textContent = `✓ ${subs.length} submissions`;
      document.getElementById('import-status').className = 'setup-status ok';
      document.getElementById('no-submissions').style.display = 'none';
      renderCards(subs);
      cacheSubmissions(subs, { label: file.name });
    } catch (err) {
      showToast('Invalid JSON: ' + err.message, 'err');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function normalizeQueryString(testUrl) {
  if (!testUrl) return '';
  const trimmed = testUrl.trim();
  if (!trimmed) return '';
  const idx = trimmed.indexOf('?');
  if (idx !== -1) {
    return trimmed.slice(idx + 1);
  }
  if (trimmed.startsWith('?')) {
    return trimmed.slice(1);
  }
  return trimmed.includes('=') ? trimmed : '';
}

function buildRedirectValue(testUrl, enemyName, author, overrides = {}) {
  const qs = normalizeQueryString(testUrl);
  const params = new URLSearchParams(qs);

  const sanitize = (value) => {
    if (value === undefined || value === null) return '';
    return String(value).trim();
  };

  const enemy = sanitize(enemyName);
  if (enemy) {
    params.set('enemy_name', enemy);
  } else {
    params.delete('enemy_name');
  }

  const authorValue = sanitize(author);
  if (authorValue) {
    params.set('author', authorValue);
  } else {
    params.delete('author');
  }

  const statMap = {
    ehp: overrides.enemy_hp,
    php: overrides.player_hp,
    pnrg: overrides.player_energy,
  };

  Object.entries(statMap).forEach(([key, value]) => {
    const normalized = sanitize(value);
    if (normalized) {
      params.set(key, normalized);
    } else {
      params.delete(key);
    }
  });

  const queryString = params.toString();
  return queryString ? `?${queryString}` : '';
}

function difficultyClass(diff) {
  return diff.toLowerCase().replace(/\s+/g, '-');
}

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function formatSubmittedDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderCards(submissions) {
  const list = document.getElementById('cards-list');
  list.innerHTML = '';

  submissions.forEach((sub, i) => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.dataset.index = i;

    const diffOptions = ['Easy', 'Medium', 'Hard', 'Very Hard'].map(d =>
      `<option value="${d}" ${sub.difficulty === d ? 'selected' : ''}>${d}</option>`
    ).join('');

    const submittedLabel = formatSubmittedDate(sub._date);
    const previewQS = buildRedirectValue(
      sub.test_url || '',
      sub.enemy_info || '',
      sub.credit_name || '',
      {
        enemy_hp: sub.enemy_hp,
        player_hp: sub.player_hp,
        player_energy: sub.player_energy,
      }
    );

    card.innerHTML = `
      <div class="sub-header">
        <span class="sub-date">Submitted ${submittedLabel}</span>
        <span class="published-badge" id="badge-${i}" style="display:none">✓ Published</span>
      </div>
      <div class="sub-fields">
        <label>Enemy</label>
        <input type="text" id="enemy-${i}" value="${escHtml(sub.enemy_info || '')}" style="width:100%;" />
        <label>Author</label>
        <input type="text" id="author-${i}" value="${escHtml(sub.credit_name || '')}" style="width:100%;" />
        <label>Difficulty</label>
        <select id="diff-${i}">${diffOptions}</select>
      </div>
      <div class="sub-actions">
        <label style="font-size:0.8rem;color:#888;">Publish on</label>
        <input type="date" id="date-${i}" />
        <button class="publish-btn" id="pub-btn-${i}" onclick="publish(${i})" ${!dirHandle ? 'disabled' : ''}>Publish →</button>
      </div>
      <div class="sub-preview">
        <a id="preview-${i}" href="#" target="_blank" rel="noopener noreferrer">localhost:8080${escHtml(previewQS)}</a>
      </div>
      <div class="sub-stats">
        <div class="stat-field">
          <label for="enemy-hp-${i}">Enemy HP</label>
          <input type="number" id="enemy-hp-${i}" value="${escHtml(sub.enemy_hp || '')}" inputmode="numeric" />
        </div>
        <div class="stat-field">
          <label for="player-hp-${i}">Player HP</label>
          <input type="number" id="player-hp-${i}" value="${escHtml(sub.player_hp || '')}" inputmode="numeric" />
        </div>
        <div class="stat-field">
          <label for="player-energy-${i}">Player EN</label>
          <input type="number" id="player-energy-${i}" value="${escHtml(sub.player_energy || '')}" inputmode="numeric" />
        </div>
      </div>
      <div class="sub-solution" id="solution-${i}">${solutionHtml(sub.solution_order)}</div>
    `;

    list.appendChild(card);
    setPreviewLink(i, previewQS);

    // Update preview live as fields change
    ['enemy', 'author', 'enemy-hp', 'player-hp', 'player-energy'].forEach(field => {
      const input = document.getElementById(`${field}-${i}`);
      if (input) {
        input.addEventListener('input', () => updatePreview(i, sub));
      }
    });

    refreshCardState(i);
  });

  // Store submissions globally
  window._submissions = submissions;
  updatePublishButtonsState();
}

function setPreviewLink(i, qs) {
  const anchor = document.getElementById(`preview-${i}`);
  if (!anchor) return;
  let linkPart = qs || '';
  if (linkPart && !linkPart.startsWith('?')) {
    const trimmed = linkPart.replace(/^\?+/, '');
    linkPart = trimmed ? `?${trimmed}` : '';
  }
  const text = linkPart ? `localhost:8080${linkPart}` : 'localhost:8080';
  const href = linkPart ? `http://localhost:8080${linkPart}` : 'http://localhost:8080';
  anchor.textContent = text;
  anchor.href = href;
  anchor.classList.toggle('disabled', !linkPart);
}

function updatePreview(i, sub) {
  const enemy = document.getElementById(`enemy-${i}`).value;
  const author = document.getElementById(`author-${i}`).value;
  const enemyHp = document.getElementById(`enemy-hp-${i}`)?.value;
  const playerHp = document.getElementById(`player-hp-${i}`)?.value;
  const playerEnergy = document.getElementById(`player-energy-${i}`)?.value;
  const qs = buildRedirectValue(sub.test_url || '', enemy, author, {
    enemy_hp: enemyHp,
    player_hp: playerHp,
    player_energy: playerEnergy,
  });
  setPreviewLink(i, qs);
}

function solutionHtml(solution) {
  if (!solution || !solution.trim()) {
    return '<span class="no-solution">No solution provided.</span>';
  }
  return escHtml(solution).replace(/\r?\n/g, '<br>');
}

function refreshPublishedState() {
  if (!window._submissions) return;
  window._submissions.forEach((_, i) => refreshCardState(i));
}

function updatePublishButtonsState() {
  const buttons = document.querySelectorAll('.publish-btn');
  buttons.forEach((btn) => {
    btn.disabled = !dirHandle;
    if (!btn.disabled && btn.textContent === 'Publishing...') {
      return;
    }
    if (btn.disabled) {
      btn.textContent = 'Publish →';
    }
  });
}

function refreshCardState(i) {
  const dateInput = document.getElementById(`date-${i}`);
  const badge = document.getElementById(`badge-${i}`);
  const card = document.getElementById(`date-${i}`)?.closest('.sub-card');
  if (!dateInput) return;

  const date = dateInput.value;
  const taken = date && publishedDates.has(date);
  if (badge) badge.style.display = taken ? 'inline' : 'none';
  if (card) card.classList.toggle('published', taken);
}

async function publish(i) {
  const sub = window._submissions[i];
  const enemy = document.getElementById(`enemy-${i}`).value.trim();
  const author = document.getElementById(`author-${i}`).value.trim();
  const diff = document.getElementById(`diff-${i}`).value;
  const date = document.getElementById(`date-${i}`).value;

  if (!date) { showToast('Pick a publish date first.', 'err'); return; }
  if (!enemy) { showToast('Enemy name is required.', 'err'); return; }
  if (!author) { showToast('Author is required.', 'err'); return; }
  if (publishedDates.has(date)) {
    if (!confirm(`${date} already has a puzzle. Overwrite?`)) return;
  }

  const btn = document.getElementById(`pub-btn-${i}`);
  btn.disabled = true;
  btn.textContent = 'Publishing...';

  try {
    const enemyHp = document.getElementById(`enemy-hp-${i}`)?.value;
    const playerHp = document.getElementById(`player-hp-${i}`)?.value;
    const playerEnergy = document.getElementById(`player-energy-${i}`)?.value;
    const qs = buildRedirectValue(sub.test_url || '', enemy, author, {
      enemy_hp: enemyHp,
      player_hp: playerHp,
      player_energy: playerEnergy,
    });
    const diffClass = difficultyClass(diff);

    // 1. custom-redirects.json
    const redirectsFH = await getFileHandle('custom-redirects.json');
    const redirectsText = await (await redirectsFH.getFile()).text();
    const redirects = JSON.parse(redirectsText);
    redirects[date] = qs;
    const rw1 = await redirectsFH.createWritable();
    await rw1.write(JSON.stringify(redirects, null, 2) + '\n');
    await rw1.close();

    // 2. manifest.json
    const manifestFH = await getFileHandle('manifest.json');
    const manifestText = await (await manifestFH.getFile()).text();
    const manifest = JSON.parse(manifestText);
    manifest.puzzles.unshift({ id: date, release_at: `${date}T00:00:00-04:00`, title: enemy });
    const rw2 = await manifestFH.createWritable();
    await rw2.write(JSON.stringify(manifest, null, 2) + '\n');
    await rw2.close();

    // 3. archive/index.html
    const archiveFH = await getFileHandle('archive/index.html');
    const archiveText = await (await archiveFH.getFile()).text();
    const newEntry = `
    <div class="grid-item">
      <a class="puzzle-link" href="/${date}">
      <img src="../Assets/Textures/leeta-256x256.svg" alt="${enemy.toLowerCase()}" class="icon" />
        <div class="info">
          <div class="enemy-name">${enemy}</div>
          <div class="date">${formatDate(date)}</div>
          <span class="difficulty-label ${diffClass}">${diff}</span>
        </div>
      </a>
      <div class="author">
        <a href="/">@${author}</a>
      </div>
    </div>
`;
    const updatedArchive = archiveText.replace('<div class="grid">', `<div class="grid">${newEntry}`);
    if (updatedArchive === archiveText) throw new Error('Could not find insertion point in archive/index.html');
    const rw3 = await archiveFH.createWritable();
    await rw3.write(updatedArchive);
    await rw3.close();

    publishedDates.add(date);
    refreshCardState(i);
    btn.textContent = '✓ Published';
    showToast(`Published "${enemy}" for ${date}`, 'ok');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Publish →';
    showToast('Error: ' + e.message, 'err');
    console.error(e);
  }
}

function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
