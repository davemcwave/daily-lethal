<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Review</title>
<style>
:root { --bg:#0f0d12; --panel:#1a1720; --panel2:#221e2a; --line:#332d3d; --text:#ece8f2; --dim:#9b93a8;
  --gold:#e6b450; --red:#e0605a; --green:#5fbf7a; --blue:#5b8cff; --amber:#d9902f; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
a { color:inherit; }
.layout { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
nav { position:sticky; top:0; height:100vh; overflow:auto; border-right:1px solid var(--line); padding:16px 10px; background:var(--panel); }
nav h1 { font-size:15px; margin:0 6px 4px; }
nav p { color:var(--dim); font-size:12px; margin:0 6px 12px; }
nav a { display:flex; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:6px; text-decoration:none; font-size:13px; }
nav a:hover { background:var(--panel2); }
nav a .c { color:var(--dim); font-variant-numeric:tabular-nums; }
nav a.done .c { color:var(--green); }
.tools { display:flex; flex-direction:column; gap:6px; margin-top:14px; padding:0 6px; }
button { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
button:hover { border-color:#4a4256; }
main { padding:20px 24px 80px; max-width:1100px; }
section { margin-bottom:34px; }
section > header h2 { margin:0; font-size:20px; }
section > header .idea { color:var(--dim); margin:2px 0 6px; }
.meta { font-size:12px; color:var(--dim); }
.chip { display:inline-block; padding:1px 7px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); font-size:12px; margin:2px 3px 2px 0; white-space:nowrap; }
.chip.new { border-color:var(--gold); color:var(--gold); }
.chip.early { border-color:var(--amber); color:var(--amber); }
.chip.boss { background:#3a1717; border-color:var(--red); color:#ffb3ae; }
.pz { display:grid; grid-template-columns:36px 1fr 300px; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:8px; }
.pz.todo { border-style:dashed; border-color:var(--gold); }
.pz.played { border-color:#2f5a3b; }
.num { font-size:18px; font-weight:700; color:var(--dim); text-align:center; }
.title { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.title b { font-size:16px; }
.skulls { color:var(--red); letter-spacing:1px; }
.stats { margin:4px 0; font-size:13px; }
.stats span { margin-right:12px; }
.hand { margin:4px 0; }
.play { display:inline-block; background:var(--gold); color:#1a1408; font-weight:600; text-decoration:none; border-radius:6px; padding:4px 12px; }
.play:hover { filter:brightness(1.1); }
details { margin-top:6px; }
summary { cursor:pointer; color:var(--dim); font-size:13px; }
ol.sol { margin:6px 0 0; padding-left:22px; }
ol.sol li { padding:1px 0; }
.src { font-size:12px; color:var(--dim); margin-top:4px; }
.side { display:flex; flex-direction:column; gap:6px; }
.verdicts { display:flex; flex-wrap:wrap; gap:4px; }
.verdicts button { font-size:12px; padding:3px 8px; }
.verdicts button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
textarea { width:100%; min-height:54px; resize:vertical; font:inherit; font-size:13px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px; }
label.chk { font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer; }
.toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--green); color:#08130b; padding:6px 14px; border-radius:6px; font-weight:600; display:none; }
@media (max-width: 860px) {
  .layout { grid-template-columns:1fr; }
  nav { position:static; height:auto; }
  .pz { grid-template-columns:28px 1fr; }
  .side { grid-column:1 / -1; }
  main { padding:16px; }
}
</style>
</head>
<body>

      <button id="clear">Clear my notes</button>
      <a href="../" style="font-size:13px;color:var(--dim);padding:4px 0">← Back to the map</a>
    </div>
  </nav>
  <main id="main"></main>
</div>

h, Slash), Slash, Slash"}]}];
const KEY = 'story-review-v1';
let notes = {};
try { notes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {} renderToc(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VERDICTS = [['fits','Fits here'],['earlier','Move earlier'],['later','Move later'],['world','Wrong world'],['cut','Cut it']];

function renderToc() {
  document.getElementById('toc').innerHTML = DATA.map(w => {
    const done = w.puzzles.filter(p => (notes[p.id] || {}).played).length;
    return `<a href="#w-${w.id}" class="${done === w.puzzles.length ? 'done' : ''}"><span>${w.n}. ${esc(w.name)}</span><span class="c">${done}/${w.puzzles.length}</span></a>`;
  }).join('');
}

// a step up of more than 40% over the previous puzzle is a cliff; lighter than the previous one is a dip
function loadNote(w, p) {
  const i = w.puzzles.indexOf(p); if (i < 1) return '';
  const load = q => q.hand.length + q.steps.length, a = load(w.puzzles[i - 1]), b = load(p);
  if (b > a * 1.4) return ` <span style="color:var(--red)">· cliff (+${Math.round((b / a - 1) * 100)}%)</span>`;
  if (b < a - 2) return ` <span style="color:var(--amber)">· dip</span>`;
  return '';
}
function puzzleHtml(w, p) {
  const n = notes[p.id] || {};
  const skulls = '☠'.repeat(p.difficulty);
  const badges = [
    ...p.teaches.map(c => `<span class="chip new" title="First puzzle in this world that uses it">new: ${esc(c)}</span>`),
    ...p.early.map(c => `<span class="chip early" title="Not taught yet when you reach this puzzle">unfamiliar: ${esc(c)}</span>`),
    p.boss ? '<span class="chip boss">boss</span>' : ''
  ].join('');
  const hand = p.hand.map(([c, k]) => `<span class="chip">${esc(c)}${k > 1 ? ' ×' + k : ''}</span>`).join('');
  const sol = p.steps.length
    ? `<ol class="sol">${p.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
       <div class="src">${p.source === 'recorded' ? 'Recorded in the game' : p.source === 'tested' ? 'Designed and tested by Claude' : 'From the Formspree submission'}${p.text ? ': “' + esc(p.text) + '”' : ''}</div>`
    : '<div class="src">No known solution.</div>';
  return `<div class="pz ${n.played ? 'played' : ''} ${p.placeholder ? 'todo' : ''}" id="p-${esc(p.id)}">
    <div class="num">${p.n}</div>
    <div>
      <div class="title"><b>${esc(p.enemy)}</b><span class="skulls" title="Author difficulty ${p.difficulty}">${skulls}</span>
        ${p.placeholder ? '<span class="chip new">placeholder: you will make this one</span>' : `<a class="play" href="${p.url || '/' + p.date}" target="_blank" rel="noopener">Play ▸</a>
        <span class="meta">${p.url ? 'not released yet' : p.date}${p.author ? ' · by ' + esc(p.author) : ''}</span>`}</div>
      ${p.note ? `<div class="stats" style="color:var(--gold)">${esc(p.note)}</div>` : ''}
      <div class="stats" ${p.placeholder ? 'hidden' : ''}><span>❤ ${p.php} HP</span><span>⚡ ${p.energy} energy</span><span>Enemy ${p.ehp} HP</span></div>
      <div class="stats meta" ${p.placeholder ? 'hidden' : ''} title="Load = unique cards in hand + card plays in the known solution"><span>${p.hand.length} unique cards</span><span>${p.steps.length} plays</span><span><b>load ${p.hand.length + p.steps.length}</b>${loadNote(w, p)}</span></div>
      <div class="hand">${hand}</div>
      <div>${badges}</div>
      <details class="soldet" ${p.placeholder ? 'hidden' : ''}><summary>Solution (${p.steps.length} steps)</summary>${sol}</details>
    </div>
    <div class="side">
      <label class="chk"><input type="checkbox" data-played="${esc(p.id)}" ${n.played ? 'checked' : ''}> Played it</label>
      <div class="verdicts">${VERDICTS.map(([k, t]) => `<button data-v="${k}" data-id="${esc(p.id)}" class="${n.verdict === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <textarea data-note="${esc(p.id)}" placeholder="Notes (where should it go, why?)">${esc(n.note || '')}</textarea>
    </div>
  </div>`;
}

function render() {
  document.getElementById('main').innerHTML = DATA.map(w => `<section id="w-${w.id}">
    <header><h2>${w.n}. ${esc(w.name)}</h2>
      <div class="idea">${esc(w.idea)}</div>
      <div class="meta" style="margin-bottom:4px">Load curve: ${w.puzzles.map(p => p.placeholder ? '?' : p.hand.length + p.steps.length).join(' › ')}</div>
      <div class="meta">Opens after: ${esc(w.after)}${w.cards.length ? ' · New cards: ' + w.cards.map(c => `<span class="chip new">${esc(c)}</span>`).join('') : ''}</div>
    </header>
    ${w.puzzles.map(p => puzzleHtml(w, p)).join('')}
  </section>`).join('');
  renderToc();
}

document.addEventListener('change', e => {
  const id = e.target.dataset.played;
  if (id) { (notes[id] ||= {}).played = e.target.checked; e.target.closest('.pz').classList.toggle('played', e.target.checked); save(); }
});
document.addEventListener('input', e => {
  const id = e.target.dataset.note;
  if (id) { (notes[id] ||= {}).note = e.target.value; save(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  const n = (notes[b.dataset.id] ||= {});
  n.verdict = n.verdict === b.dataset.v ? '' : b.dataset.v;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === n.verdict));
  save();
});
let solOpen = false;
document.getElementById('toggleSol').onclick = e => {
  solOpen = !solOpen;
  document.querySelectorAll('details.soldet').forEach(d => d.open = solOpen);
  e.target.textContent = solOpen ? 'Hide all solutions' : 'Show all solutions';
};
document.getElementById('copy').onclick = async () => {
  const label = Object.fromEntries(VERDICTS);
  const lines = [];
  for (const w of DATA) {
    const rows = w.puzzles.filter(p => notes[p.id] && (notes[p.id].verdict || notes[p.id].note));
    if (!rows.length) continue;
    lines.push(`## ${w.name}`);
    for (const p of rows) {
      const n = notes[p.id];
      lines.push(`- #${p.n} ${p.enemy} (${p.date})${n.verdict ? ' [' + label[n.verdict] + ']' : ''}${n.note ? ': ' + n.note.trim() : ''}`);
    }
  }
  const text = lines.join('\n') || 'No notes yet.';
  try { await navigator.clipboard.writeText(text); } catch (err) { prompt('Copy your notes:', text); return; }
  const t = document.getElementById('toast'); t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1200);
};
document.getElementById('clear').onclick = () => {
  if (!confirm('Clear every note, verdict and "played" mark?')) return;
  notes = {}; save(); render();
};
render();
</script>
